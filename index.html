<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Study Bloom</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Today</h1></div>
      <div class="top-actions"><button class="icon-btn" id="themeBtn" aria-label="Toggle light and dark mode">◐</button><button class="icon-btn" id="settingsBtn" aria-label="Open settings">⚙</button></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <button class="fab" id="quickAdd" aria-label="Quick add">+</button>
    <nav class="nav" aria-label="Main navigation">
      <button data-view="today" class="active"><span>⌂</span>Today</button>
      <button data-view="timetable"><span>▦</span>Timetable</button>
      <button data-view="assignments"><span>✓</span>Assignments</button>
      <button data-view="study"><span>◷</span>Study</button>
      <button data-view="planner"><span>•••</span>Planner</button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
